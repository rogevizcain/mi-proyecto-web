<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Buzón CUC Escucha</h1>
        <p>Tu voz mejora la experiencia en la Universidad de la Costa</p>
    </header>

    <main>

        <section class="contenedor">

            <h2>Registrar una sugerencia</h2>

            <form>

                <div class="grupo">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej. Laura Gómez"
                        required>
                </div>

                <div class="grupo">
                    <label for="correo">Correo institucional</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="nombre@cuc.edu.co"
                        required>
                </div>

                <div class="grupo">
                    <label for="categoria">Categoría de la sugerencia</label>

                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una opción</option>
                        <option value="bienestar">Bienestar</option>
                        <option value="servicios">Servicios</option>
                        <option value="clases">Clases</option>
                        <option value="inclusion">Inclusión</option>
                        <option value="espacios">Espacios</option>
                        <option value="procesos">Procesos académicos</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="facultad">Facultad</label>

                    <select id="facultad" name="facultad" required>
                        <option value="">Seleccione una opción</option>
                        <option value="ingenieria">Ingeniería</option>
                        <option value="derecho">Derecho</option>
                        <option value="ciencias-economicas">Ciencias Económicas</option>
                        <option value="salud">Ciencias de la Salud</option>
                        <option value="humanidades">Humanidades</option>
                        <option value="arquitectura">Arquitectura</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="mensaje">Sugerencia</label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="4"
                        placeholder="Cuéntanos tu idea o sugerencia..."
                        required></textarea>
                </div>

                <button type="submit">Enviar sugerencia</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Universidad de la Costa | Buzón CUC Escucha</p>
    </footer>

</body>

</html>
